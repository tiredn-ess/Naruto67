<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pc=(a,b)=>Math.max(0,Math.min(100,a/b*100));
function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Не удалось сохранить: хранилище браузера недоступно или заполнено');return false}}
function toast(t){const e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)}
const LOC={konoha:{n:'Коноха',d:'Деревня Скрытого Листа'},train:{n:'Полигон Учиха',d:'Тренировочная площадка клана'},forest:{n:'Лес Смерти',d:'Опасные дебри у границы'},suna:{n:'Суна',d:'Деревня Скрытого Песка'},kiri:{n:'Кири',d:'Деревня Скрытого Тумана'},iwa:{n:'Ива',d:'Деревня Скрытого Камня'},kumo:{n:'Кумо',d:'Деревня Скрытого Облака'},bridge:{n:'Мост Каннаби',d:'Линия фронта'},ame:{n:'Аме',d:'Деревня Скрытого Дождя'}};
const DAYS={konoha:0,train:0,forest:1,suna:3,kiri:4,iwa:4,kumo:5,bridge:3,ame:2},VL={suna:'Суна',kiri:'Кири',iwa:'Ива',kumo:'Кумо'};
const cost=(a,b)=>{const x=DAYS[a],y=DAYS[b];return x<=1&&y<=1?Math.max(1,Math.abs(x-y)):x+y};
const NPC={hiruzen:['Хирузен Сарутоби','Мудрый, терпеливый, ценит Волю Огня','Сохранить мир и воспитать новое поколение'],jiraiya:['Джирайя','Шутник и разведчик, добр к ученикам','Собрать сведения о угрозах миру'],tsunade:['Цунаде','Резкая, азартная, лучший медик','Спасать жизни и не потерять ещё кого-то'],orochimaru:['Орочимару','Холодный, любопытный, опасный','Постичь тайны техник'],minato:['Минато Намикадзе','Быстрый, добрый, командный игрок','Защитить деревню и будущее'],kushina:['Кушина Узумаки','Вспыльчивая, но заботливая','Защитить семью и друзей'],kakashi:['Какаши Хатаке','Спокойный, верный товарищам','Не повторить ошибок прошлого'],fugaku:['Фугаку Учиха','Строгий глава клана, гордый','Вернуть клану уважение в деревне'],itachi:['Итачи Учиха','Молчаливый гений, ценит мир','Избежать войны любой ценой'],danzo:['Данзо Шимура','Расчётливый, скрытный, жёсткий','Сила Конохи любой ценой'],shizune:['Шизуне','Исполнительная, добрая помощница','Помогать Цунаде и больнице']};
const QS=['Сила шиноби — в тех, кого он защищает.','Тренируйся, но не забывай отдыхать.','Мир хрупок; будь осторожен в словах.','Огонь Учиха — не только сила, но и ответственность.','Каждое решение оставляет след в истории.'];
const SC=[
{n:'Третья мировая война шиноби',desc:'Фронт у Моста Каннаби. Коноха истощена войной с Камнем.',pol:'Лист воюет с Ивой, Суна давит на западе, Кири выжидает. Хокаге — Хирузен.',V:{suna:-30,kiri:0,iwa:-60,kumo:-10},npc:['hiruzen','jiraiya','tsunade','orochimaru','minato'],ev:'Приказ из резиденции Хокаге: генинов привлекают к заданиям в тылу фронта.',ms:[['a1','Разведка тропы у моста','bridge','Разведчик Ивы',2,40,80],['a2','Охрана обоза с провизией','forest','Налётчик-нукенин',1,25,50],['a3','Перехват курьера Ивы','iwa','Курьер Ивы',3,60,120]]},
{n:'Эпоха Минато Намикадзе',desc:'Минато — Четвёртый Хокаге. Хрупкий мир, Кушина ждёт ребёнка.',pol:'Ива копит силы, Кумо шлёт посланников, Учиха хотят больше влияния.',V:{suna:10,kiri:0,iwa:-30,kumo:-5},npc:['minato','kushina','kakashi','jiraiya','fugaku'],ev:'Хокаге Минато лично вручает вам задание: деревня должна видеть, что ей служит новое поколение.',ms:[['b1','Патруль границы с Ивой','bridge','Диверсант Ивы',2,40,80],['b2','Сопровождение посла Кумо','kumo','Разбойник',2,45,90],['b3','Зачистка Леса Смерти','forest','Дикий зверь',3,55,100]]},
{n:'После Минато: время Третьего',desc:'Ночь Девятихвостого позади. Хирузен вновь Хокаге.',pol:'Деревня в трауре, Учиха под подозрением, Данзо усиливает тайную службу.',V:{suna:5,kiri:-5,iwa:-20,kumo:-10},npc:['hiruzen','fugaku','itachi','danzo','kakashi'],ev:'На улицах шепчутся о Девятихвостом. Фугаку просит вас быть осторожнее с лишними словами.',ms:[['c1','Помощь в восстановлении района','konoha','Мародёр',1,20,40],['c2','Расследование шпионов Ивы','ame','Шпион Ивы',2,40,80],['c3','Встреча с агентом Корня','forest','Агент Корня',3,60,100]]},
{n:'Эпоха Цунаде',desc:'Цунаде — Пятая Хокаге. Коноха оправляется после нападения Орочимару.',pol:'Союз с Суной хрупок, Акацуки в тени, Данзо плетёт интриги. Вы — один из немногих Учиха, оставшихся в деревне.',V:{suna:20,kiri:-5,iwa:-25,kumo:-5},npc:['tsunade','shizune','kakashi','jiraiya','danzo'],ev:'Цунаде вызывает вас в резиденцию: больнице и разведке нужны люди.',ms:[['d1','Поставка лекарств в больницу','konoha','Мародёр',1,20,50],['d2','Поиск пропавшего разведчика','ame','Нукенин',3,60,110],['d3','Охрана посла Суны','suna','Налётчик',2,40,90]]},
{n:'Альтернатива: Минато жив, Учиха целы',desc:'Минато выжил, а клан Учиха не был уничтожен.',pol:'Хокаге Минато держит союз с кланом Учиха; Фугаку в совете; Ива и Кумо следят.',V:{suna:15,kiri:0,iwa:-20,kumo:5},npc:['minato','kushina','fugaku','itachi','hiruzen','kakashi'],ev:'Клан Учиха и Хокаге договорились о совместных патрулях. Вас включили в смешанный отряд.',ms:[['e1','Совместный патруль Учиха и АНБУ','konoha','Мятежный шиноби',2,40,80],['e2','Дипломатическая миссия в Кумо','kumo','Нукенин',3,60,110],['e3','Испытание у Полигона Учиха','train','Тренировочный голем',2,35,60]]}];
const EN={forest:'Дикий зверь',bridge:'Шиноби Ивы',suna:'Нукенин Песка',kiri:'Нукенин Тумана',iwa:'Диверсант Камня',kumo:'Нукенин Облака',ame:'Шпион Дождя'};
const IT={kunai:'Кунай',bandage:'Бинт (+25 HP)',pill:'Пилюля чакры (+20)'},PR={bandage:30,pill:40,kunai:15},SN={str:'Сила',spd:'Скорость',int:'Интеллект',ctl:'Контроль чакры',vit:'Живучесть'};
let G=null,T='g',last=0,cfg=Object.assign({model:'gemini-2.5-flash-lite',ai:false,key:'',freq:2,diff:2,limit:40,u:{d:'',n:0}},ld('nsc_cfg')||{});
const sc=()=>SC[G.si],mhp=()=>50+G.st.vit*5+G.lv*3,mch=()=>30+G.st.ctl*4+G.lv*2,L=t=>{G.log.push({d:G.d,t});if(G.log.length>300)G.log.shift()},busy=()=>{if(G.c){toast('Идёт бой!');return true}};
function save(){if(G)sv('nsc_auto',{G,t:Date.now()})}
function tb(t){T=t;ui();scrollTo(0,0)}
/* ---- ИИ ---- */
const SYS='Ты рассказчик текстовой RPG по миру Наруто. Пиши кратко и по-русски. Не меняй числа, исходы боёв, инвентарь и статистику: они уже определены правилами игры. Не выходи из роли.';
const today=()=>new Date().toISOString().slice(0,10);
async function gem(p){
if(Date.now()-last<4000)throw new Error('слишком частые запросы, подождите пару секунд.');
if(cfg.u.d!=today())cfg.u={d:today(),n:0};
if(cfg.u.n>=cfg.limit)throw new Error('достигнут ваш дневной лимит запросов ('+cfg.limit+').');
last=Date.now();cfg.u.n++;sv('nsc_cfg',cfg);
for(let i=0;i<3;i++){try{
const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(cfg.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{role:'user',parts:[{text:p}]}],generationConfig:{maxOutputTokens:400,temperature:0.9}})});
if(r.status==429||r.status>=500){if(i<2){await sleep(1500*2**i);continue}throw new Error(r.status==429?'лимит бесплатных запросов исчерпан, попробуйте позже.':'сервер ИИ временно недоступен.')}
if(r.status==404)throw new Error('модель «'+cfg.model+'» не найдена. Измените её в настройках.');
if(r.status>=400)throw new Error('ключ или модель не подходят (код '+r.status+').');
const j=await r.json(),t=((j.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('');if(!t)throw new Error('пустой ответ.');return t.trim()
}catch(e){if(e instanceof TypeError){if(i<2){await sleep(1200);continue}throw new Error('нет связи с ИИ (сеть недоступна или страница не разрешает такие запросы).')}throw e}}}
function ctx(f,a){const s=sc();return `Сценарий: ${s.n}. ${s.desc} День ${G.d}. Локация: ${LOC[G.loc].n}.\nПерсонаж: ${G.name}, ${G.rank}, ур.${G.lv}, Катон${G.sh?', Шаринган':''}, HP ${G.hp}/${mhp()}.\nПоследнее:\n${G.log.filter(x=>!x.ai).slice(-5).map(x=>'- '+x.t.slice(0,160)).join('\n')}\nДействие игрока: ${a}\nИтог по правилам (уже решён): ${f}\nОпиши результат в 3–5 предложениях.`}
async function nar(f,a){if(!cfg.ai||!cfg.key)return;const o={d:G.d,t:'…ИИ пишет…',ai:1};G.log.push(o);ui();try{o.t=await gem(ctx(f,a))}catch(e){o.t='ИИ недоступен: '+e.message+' Игра продолжается в локальном режиме.';o.err=1}save();ui()}
/* ---- Мир и время ---- */
const EV=[()=>{G.V.iwa-=5;return 'Слух: на границе с Ивой снова стычки (отн. с Ивой −5).'},()=>{G.V.suna+=4;return 'Караван из Суны принёс добрые вести (отн. с Суной +4).'},()=>{G.fame++;return 'В деревне праздник — вас узнают на улицах (слава +1).'},()=>{const r=R(10,40);G.ryo+=r;return 'Вы нашли потерянный кошелёк: +'+r+' рё.'},()=>{G.V.kiri-=3;return 'У ворот заметили шпиона Кири (отн. −3).'},()=>{G.V.kumo+=3;return 'Посланники Кумо предложили торговый договор (+3).'},()=>{if(G.loc!='konoha'&&G.loc!='train'&&!G.c){fight(EN[G.loc]||'Бандит',G.lv);return 'Засада на дороге!'}return 'День проходит спокойно.'}];
function passDay(n){for(let i=0;i<n;i++){G.d++;G.hp=Math.min(mhp(),G.hp+Math.ceil(mhp()*.05));G.ch=Math.min(mch(),G.ch+Math.ceil(mch()*.1));if(Math.random()<[0,.15,.3,.5][cfg.freq])L(pick(EV)())}}
function mv(to){const c=cost(G.loc,to);passDay(c);G.loc=to;L('Вы прибыли: '+LOC[to].n+' (в пути дней: '+c+').');return c}
function go(to,t){if(busy())return;if(to==G.loc)return toast('Вы уже здесь');const c=mv(to);if(c>=3&&!G.c&&R(1,100)<35){fight('Бандит-нукенин',G.lv);L('Засада на дороге!')}if(t)nar('Прибытие: '+LOC[to].n,t);ui()}
function addXp(n){G.xp+=n;while(G.xp>=G.lv*60){G.xp-=G.lv*60;G.lv++;G.pts+=2;G.hp=mhp();G.ch=mch();L('⭐ Уровень '+G.lv+'! +2 очка характеристик.');if(G.lv==3&&G.rank=='Генин'){G.rank='Чунин';L('Вы сдали экзамен — ранг Чунин!')}if(G.lv==6&&G.rank=='Чунин'){G.rank='Джонин';L('Вы достигли ранга Джонин!')}}}
/* ---- Бой ---- */
function fight(n,lv,mid){lv=Math.max(1,lv+cfg.diff-2);const h=30+lv*14;G.c={n,lv,hp:h,mhp:h,mid};L('⚔ Бой: '+n+' (ур. '+lv+')')}
function cAct(a){const c=G.c;if(!c)return;let m='',d=0;
if(a=='atk'){d=R(6,10)+Math.floor(G.st.str*1.5);if(Math.random()<.1+G.st.spd/100){d*=2;m='Критический удар! '}}
else if(a=='katon'){if(G.ch<12)return toast('Не хватает чакры (нужно 12)');G.ch-=12;d=R(14,20)+G.st.ctl*2;m='Катон: Огненный шар! '}
else if(a=='kunai'){if(!G.inv.kunai)return toast('Нет кунаев');G.inv.kunai--;d=R(5,9)+G.st.spd;m='Бросок кунаев. '}
else if(a=='guard'){G.ch=Math.min(mch(),G.ch+4);m='Защитная стойка. '}
else if(a=='flee'){if(Math.random()<.35+G.st.spd/30){G.c=null;L('Вы сбежали от '+c.n+'.');return ui()}m='Побег не удался! '}
c.hp-=d;if(d)m+='Урон: '+d+'. ';if(c.hp<=0)return win();
let e=Math.round((R(4,8)+c.lv*3)*[0,.8,1,1.25][cfg.diff]);if(a=='guard')e=Math.floor(e/2);G.hp-=e;m+=c.n+' наносит '+e+'. ';
if(!G.sh&&G.hp>0&&G.hp<mhp()*.3&&G.lv>=2&&Math.random()<.3){G.sh=true;G.st.spd+=2;G.st.int+=2;m+='Глаза вспыхивают — ШАРИНГАН пробуждён!'}
L(m);if(G.hp<=0)return lose();ui()}
function win(){const c=G.c;G.c=null;const x=15+c.lv*10,r=R(10,30)+c.lv*10;G.ryo+=r;let f='Победа над '+c.n+'! Опыт +'+x+', рё +'+r+'.';addXp(x);if(c.mid){const m=sc().ms.find(q=>q[0]==c.mid);if(!G.done.includes(c.mid)){G.done.push(c.mid);addXp(m[5]);G.ryo+=m[6];G.fame+=2;f+=' Миссия «'+m[1]+'» выполнена: +'+m[5]+' опыта, +'+m[6]+' рё.'}}L(f);nar(f,'Бой');ui()}
function lose(){const c=G.c;G.c=null;const l=Math.floor(G.ryo/3);G.ryo-=l;G.loc='konoha';G.hp=1;passDay(3);G.hp=Math.floor(mhp()/2);L('Вас победил '+c.n+'. Вы очнулись в больнице Конохи: потеряно '+l+' рё, прошло 3 дня.');ui()}
/* ---- Действия ---- */
function train(k,t){if(busy())return;const tr=G.tr;tr[k]=(tr[k]||0)+1;let f='Тренировка: '+SN[k]+' ('+tr[k]+'/4). Опыт +8.';if(tr[k]>=4){tr[k]=0;G.st[k]++;f+=' Навык вырос: '+SN[k]+' +1!'}G.hp=Math.max(1,G.hp-R(0,4));addXp(8);passDay(1);L(f);if(t)nar(f,t);ui()}
function rest(t){if(busy())return;passDay(1);G.hp=Math.min(mhp(),G.hp+Math.ceil(mhp()*.4));G.ch=Math.min(mch(),G.ch+Math.ceil(mch()*.4));L('Вы отдохнули день: здоровье и чакра частично восстановлены.');if(t)nar('Отдых',t);ui()}
function wait(){if(busy())return;passDay(1);L('Вы проводите день в ожидании.');ui()}
function explore(t){if(busy())return;passDay(1);if(G.c){ui();return}const r=R(1,10);let f;
if(r<=2)f='Ничего необычного.';else if(r<=4){const x=R(15,45);G.ryo+=x;f='Вы нашли тайник: +'+x+' рё.'}
else if(r==5){const k=pick(['kunai','bandage','pill']);G.inv[k]=(G.inv[k]||0)+1;f='Находка: '+IT[k]+'.'}
else if(r==6){const k=pick(sc().npc);G.rel[k]=Math.min(100,(G.rel[k]||0)+3);(G.mem[k]=G.mem[k]||[]).push('День '+G.d+': случайная встреча');f='Случайная встреча: '+NPC[k][0]+' (отношения +3).'}
else if(r<=8){if(G.loc=='konoha'||G.loc=='train')f='Слухи на улицах: '+pick(sc().pol.split('. '))+'.';else{fight(EN[G.loc]||'Бандит',G.lv);f='Засада!'}}
else if(r==9){addXp(10);f='Вы узнали что-то полезное: опыт +10.'}else{G.pts++;f='Старый свиток с заметками: +1 очко характеристик.'}
L(f);if(t||G.c)nar(f,t||'Исследование');ui()}
function talk(k,t){if(busy())return;if(!['konoha','train'].includes(G.loc))return toast('Этот персонаж сейчас в Конохе');if(G.talked[k]==G.d)return toast('Сегодня вы уже говорили — приходите завтра');G.talked[k]=G.d;const n=NPC[k][0];G.rel[k]=Math.min(100,(G.rel[k]||0)+R(2,6));const r=R(1,4);let f;
if(r==1){addXp(6);f='делится советом (+6 опыта)'}else if(r==2){G.inv.bandage=(G.inv.bandage||0)+1;f='даёт вам бинт'}else if(r==3){const v=pick(Object.keys(G.V));G.V[v]+=2;f='рассказывает слухи; отношения с деревней '+VL[v]+' +2'}else f='тепло беседует с вами';
(G.mem[k]=G.mem[k]||[]).push('День '+G.d+': '+f);G.mem[k]=G.mem[k].slice(-3);L(n+' '+f+'. «'+pick(QS)+'»');nar(n+' '+f+'. Отношения улучшились.','Разговор с '+n+(t?': '+t:''));ui()}
function doM(id){if(busy())return;const m=sc().ms.find(x=>x[0]==id);if(G.done.includes(id))return;if(G.loc!=m[2])mv(m[2]);if(G.c)return ui();fight(m[3],m[4],id);ui()}
function spend(k){if(G.pts<1)return;G.pts--;G.st[k]++;ui()}
function useI(k){if(busy())return;if(!G.inv[k])return;if(k=='bandage')G.hp=Math.min(mhp(),G.hp+25);else if(k=='pill')G.ch=Math.min(mch(),G.ch+20);else return toast('Кунай используется в бою');G.inv[k]--;ui()}
function buy(k){if(G.loc!='konoha')return toast('Магазин находится в Конохе');if(G.ryo<PR[k])return toast('Не хватает рё');G.ryo-=PR[k];G.inv[k]=(G.inv[k]||0)+(k=='kunai'?5:1);ui()}
async function act(){const el=$('#ai'),t=(el.value||'').trim();if(!t)return toast('Введите действие');if(busy())return;el.value='';const l=t.toLowerCase(),w=l.split(/[^а-яё]+/);
if(/трен/.test(l))return train(/катон|огн|чакр/.test(l)?'ctl':/скор|быстр/.test(l)?'spd':/ум|мысл|книг|стратег/.test(l)?'int':'str',t);
if(/отдых|спат|спать|леч/.test(l))return rest(t);
if(/исслед|осмотр|ищу|искат|поиск/.test(l))return explore(t);
for(const k in LOC)if(w.some(x=>x.length>2&&x.startsWith(LOC[k].n.toLowerCase().slice(0,4).trim())))return go(k,t);
for(const k of sc().npc)if(w.some(x=>x.length>3&&x.startsWith(NPC[k][0].split(' ')[0].toLowerCase().slice(0,4))))return talk(k,t);
passDay(1);const r=R(1,6);let f;if(r<=2){G.fame++;f='Ваши действия заметили: слава +1.'}else if(r==3){const k=pick(Object.keys(G.V));G.V[k]+=3;f='Отношения с деревней '+VL[k]+' улучшились (+3).'}else if(r==4){G.ryo+=R(5,25);f='Вы подработали и получили немного рё.'}else if(r==5){addXp(6);f='Опыт +6.'}else f='Ничего заметного не изменилось.';
L('Вы: «'+t+'». '+f);nar(f,t);ui()}
/* ---- Экраны ---- */
function vStart(){const a=ld('nsc_auto');return `<h1>NARUTO<br><small>Shinobi Chronicles</small></h1>${a&&a.G?'<button class="b p w" onclick="loadK(\'nsc_auto\')">Продолжить (автосохранение)</button>':''}<h3>Ваш герой</h3><input id="nm" value="Рэн Учиха" maxlength="24"><select id="fc"><option value="str">Упор: сила</option><option value="spd">Упор: скорость</option><option value="ctl" selected>Упор: контроль чакры (Катон)</option><option value="int">Упор: интеллект</option></select><h3>Сценарий</h3>${SC.map((s,i)=>`<div class="card"><b>${s.n}</b><div class="m">${s.desc}</div><div class="m">${s.pol}</div><button class="b p w" onclick="start(${i})">Начать</button></div>`).join('')}<button class="b w" onclick="T='s';ui()">⚙ Настройки ИИ</button>`}
function start(i){const nm=($('#nm').value||'').trim()||'Рэн Учиха',f=$('#fc').value,s=SC[i];G={si:i,name:nm.slice(0,24),d:1,loc:'konoha',lv:1,xp:0,pts:0,rank:'Генин',ryo:100,st:{str:5,spd:6,int:5,ctl:6,vit:5},tr:{},sh:false,inv:{kunai:5,bandage:2,pill:1},rel:{},mem:{},talked:{},V:{...s.V},done:[],log:[],c:null,fame:0};G.st[f]+=2;s.npc.forEach(k=>G.rel[k]=k=='fugaku'||k=='itachi'?25:10);G.hp=mhp();G.ch=mch();L(s.ev);T='g';ui()}
function vGame(){const s=sc(),c=G.c;let h=`<div class="card"><div class="r"><b>${LOC[G.loc].n}</b><span class="m">День ${G.d} · ${G.rank}</span></div><div class="m">${LOC[G.loc].d}. ${s.n}</div><div class="bar"><i style="width:${pc(G.hp,mhp())}%;background:var(--bad)"></i></div><div class="bar"><i style="width:${pc(G.ch,mch())}%;background:#3b82f6"></i></div><div class="m">HP ${G.hp}/${mhp()} · Чакра ${G.ch}/${mch()} · ${G.ryo} рё</div></div>`;
if(c)h+=`<div class="card"><b>⚔ ${E(c.n)}</b> <span class="m">ур. ${c.lv}</span><div class="bar"><i style="width:${pc(c.hp,c.mhp)}%;background:var(--ac)"></i></div><div class="m">HP ${Math.max(0,c.hp)}/${c.mhp}</div><div class="g"><button class="b p" onclick="cAct('atk')">👊 Удар</button><button class="b p" onclick="cAct('katon')">🔥 Катон (12)</button><button class="b" onclick="cAct('kunai')">🗡 Кунай (${G.inv.kunai||0})</button><button class="b" onclick="cAct('guard')">🛡 Защита</button></div><button class="b w" onclick="cAct('flee')">🏃 Бежать</button></div>`;
else h+=`<div class="card"><div class="g g4"><button class="b" onclick="train('str')">💪 Сила</button><button class="b" onclick="train('spd')">⚡ Скор.</button><button class="b" onclick="train('ctl')">🔥 Катон</button><button class="b" onclick="train('int')">🧠 Ум</button></div><div class="g" style="grid-template-columns:repeat(3,1fr)"><button class="b" onclick="explore()">🔍 Искать</button><button class="b" onclick="rest()">😴 Отдых</button><button class="b" onclick="wait()">⏳ Ждать</button></div><input id="ai" placeholder="Своё действие: «поговорить с Какаши», «идти в Суну»…" maxlength="200" onkeydown="if(event.key=='Enter')act()"><button class="b p w" onclick="act()">Выполнить действие</button></div>`;
return h+G.log.slice(-15).reverse().map(x=>`<p class="lg${x.ai?' ai':''}${x.err?' er':''}"><span class="m">Д${x.d}</span> ${E(x.t)}</p>`).join('')}
function vChar(){return `<div class="card"><b>${E(G.name)}</b> — ${G.rank}, уровень ${G.lv}<div class="m">Клан Учиха · Коноха · Стихия: Катон · Шаринган: ${G.sh?'пробуждён':'не пробуждён'}</div><div class="bar"><i style="width:${pc(G.xp,G.lv*60)}%;background:var(--ok)"></i></div><div class="m">Опыт ${G.xp}/${G.lv*60} · слава ${G.fame}</div><p class="m">${E(G.name)} — 16-летний генин из клана Учиха, выросший в Конохе. Мечтает пробудить Шаринган и доказать, что огонь клана служит деревне. Цели: пробудить Шаринган, стать чунином, понять прошлое клана.</p></div><h3>Характеристики${G.pts?' (очков: '+G.pts+')':''}</h3>${Object.keys(SN).map(k=>`<div class="card r"><span>${SN[k]}: <b>${G.st[k]}</b></span>${G.pts?`<button class="b p" onclick="spend('${k}')">+1</button>`:''}</div>`).join('')}<h3>Инвентарь</h3>${Object.keys(IT).map(k=>`<div class="card r"><span>${IT[k]} × ${G.inv[k]||0}</span><span><button class="b" onclick="useI('${k}')">Исп.</button> <button class="b" onclick="buy('${k}')">${PR[k]} рё</button></span></div>`).join('')}<p class="m">Покупки — только в Конохе.</p>`}
function vPpl(){return sc().npc.map(k=>{const n=NPC[k],r=G.rel[k]||0,m=(G.mem[k]||[]).slice(-1)[0];return `<div class="card"><b>${n[0]}</b><div class="m">${n[1]}<br>Цель: ${n[2]}</div><div class="bar"><i style="width:${r}%;background:var(--ok)"></i></div><div class="m">Отношение: ${r}/100${m?'<br>Помнит: '+E(m):''}</div><button class="b w" onclick="talk('${k}')">💬 Поговорить</button></div>`}).join('')}
function vMis(){return `<h3>Миссии: ${sc().n}</h3>${sc().ms.map(m=>`<div class="card"><b>${m[1]}</b><div class="m">${LOC[m[2]].n} · враг: ${m[3]} (ур. ${m[4]}) · награда: ${m[5]} опыта, ${m[6]} рё</div>${G.done.includes(m[0])?'<div style="color:var(--ok)">✓ Выполнено</div>':`<button class="b p w" onclick="doM('${m[0]}')">Отправиться и выполнить</button>`}</div>`).join('')}<h3>Журнал решений</h3>${G.log.slice(-80).reverse().map(x=>`<p class="lg${x.ai?' ai':''}"><span class="m">Д${x.d}</span> ${E(x.t)}</p>`).join('')}`}
function vMap(){const lb=v=>v<-40?'враждебно':v<-10?'напряжённо':v<20?'нейтрально':'дружественно';return `<div class="card"><b>Политика</b><div class="m">${sc().pol}</div></div>${Object.keys(VL).map(k=>`<div class="card r"><span>${VL[k]}</span><span class="m">${lb(G.V[k])} (${G.V[k]})</span></div>`).join('')}<h3>Карта (вы: ${LOC[G.loc].n})</h3><div class="g">${Object.keys(LOC).filter(k=>k!=G.loc).map(k=>`<button class="b" onclick="go('${k}')">${LOC[k].n}<br><span class="m">${cost(G.loc,k)} дн.</span></button>`).join('')}</div>`}
const op=(a,c)=>a.map((x,i)=>`<option value="${i+1}"${i+1==c?' selected':''}>${x}</option>`).join('');
function vSet(){return `<h3>ИИ и настройки</h3><div class="card"><label class="m">Модель Gemini (можно менять)</label><input id="md" value="${E(cfg.model)}"><label class="m">API-ключ (хранится только на этом устройстве)</label><input id="ky" type="password" autocomplete="off" value="${E(cfg.key)}"><label><input id="ae" type="checkbox"${cfg.ai?' checked':''}> Включить ИИ-рассказчика</label><label class="m"><br>Лимит ИИ-запросов в день</label><input id="lm" type="number" min="1" max="500" value="${cfg.limit}"><label class="m">Сложность</label><select id="df">${op(['Лёгкая','Обычная','Сложная'],cfg.diff)}</select><label class="m">Частота событий</label><select id="fq">${op(['Низкая','Средняя','Высокая'],cfg.freq)}</select><button class="b p w" onclick="saveCfg()">Сохранить</button><button class="b w" onclick="testAI()">Проверить связь с ИИ</button><p class="m">Ключ не входит в код игры и в сохранения. Без ключа или при ошибке игра работает в локальном режиме. Эта страница внутри чата не может обращаться к Gemini; ИИ заработает, когда файл игры открыт как обычный сайт.</p></div>${G?'':'<button class="b w" onclick="T=\'g\';ui()">Назад</button>'}`}
function saveCfg(){cfg.model=$('#md').value.trim()||'gemini-2.5-flash-lite';cfg.key=$('#ky').value.trim();cfg.ai=$('#ae').checked;cfg.limit=Math.max(1,+$('#lm').value||40);cfg.diff=+$('#df').value;cfg.freq=+$('#fq').value;if(sv('nsc_cfg',cfg))toast(cfg.ai&&!cfg.key?'Сохранено, но ключ не введён — ИИ не будет работать':'Настройки сохранены')}
async function testAI(){saveCfg();if(!cfg.key)return toast('Сначала введите ключ');try{await gem('Ответь одним словом: готов');toast('ИИ отвечает ✓')}catch(e){toast('ИИ недоступен: '+e.message)}}
function vMenu(){const sl=[1,2,3].map(n=>{const o=ld('nsc_s'+n);return `<div class="card"><div class="r"><span>Слот ${n}<div class="m">${o?new Date(o.t).toLocaleString('ru')+' · день '+o.G.d:'пусто'}</div></span><span><button class="b" onclick="slotSave(${n})">Сохр.</button> <button class="b" onclick="loadK('nsc_s${n}')">Загр.</button></span></div></div>`}).join('');
return `<h3>Сохранения</h3><p class="m">Игра сохраняется автоматически в браузере этого устройства. Если очистить данные сайта в Safari, сохранения исчезнут, а между устройствами они не синхронизируются — делайте экспорт JSON.</p>${sl}<div class="card"><button class="b w" onclick="exp()">Экспорт в JSON</button><textarea id="ex" rows="3" placeholder="Здесь появится JSON сохранения"></textarea><textarea id="im" rows="3" placeholder="Вставьте JSON для импорта"></textarea><button class="b w" onclick="impt()">Импорт из JSON</button></div>${vSet()}<button class="b w" onclick="if(confirm('Начать новую игру? Автосохранение будет заменено при следующем ходе.')){G=null;T='g';ui()}">Новая игра / сценарий</button>`}
function slotSave(n){if(sv('nsc_s'+n,{G,t:Date.now()})){toast('Сохранено в слот '+n);ui()}}
function loadK(k){const o=ld(k);if(!o||!o.G)return toast('Сохранение не найдено');G=o.G;T='g';ui()}
function exp(){const e=$('#ex');e.value=JSON.stringify(G);e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast('Скопировано'),()=>toast('Скопируйте текст вручную'))}catch(x){toast('Скопируйте текст вручную')}}
function impt(){try{let o=JSON.parse($('#im').value);if(o.G)o=o.G;if(!o||!o.st||!SC[o.si]||!o.log)throw 0;G=o;T='g';ui();toast('Сохранение загружено')}catch(e){toast('Файл сохранения повреждён или не подходит')}}
function ui(){const v=$('#v');if(!G){$('#n').style.display='none';v.innerHTML=T=='s'?vSet():vStart();return}
$('#n').style.display='flex';v.innerHTML={g:vGame,c:vChar,p:vPpl,m:vMis,w:vMap,s:vMenu}[T]();document.querySelectorAll('#n button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));save()}
ui();
</script></body></html>
